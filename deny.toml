# cargo-deny policy. Run with `just deny`. Rationale: docs/adr/0003-workspace-and-tooling.md.

[graph]
all-features = true

[advisories]
# Known vulnerabilities and unmaintained crates fail the check. To ignore one, add its id
# below with a comment saying why it does not apply and when to revisit.
ignore = [
    # Iced 0.14 → wgpu 27 → metal. paste is archived. No upgrade until that stack moves.
    # Revisit when Iced no longer depends on wgpu 27.
    "RUSTSEC-2024-0436",
    # Iced 0.14 font stack (cosmic-text/fontdb, and winit via ab_glyph). Unmaintained, not a
    # known vulnerability. Revisit when Iced switches off ttf-parser.
    "RUSTSEC-2026-0192",
    # zbus 5 names/variant crates were folded into zbus 6. Pulled by Iced 0.14 → iced_winit → mundy.
    # Revisit when Iced depends on zbus 6.
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0372",
]

[licenses]
# Permissive licenses only. Adding a license here is a deliberate decision: copyleft or
# unusual terms in a dependency would constrain how this project can be licensed (ADR-0004).
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # Boost Software License. Permissive. Pulled by Iced's Windows clipboard crate.
    "BSL-1.0",
]
confidence-threshold = 0.93

[licenses.private]
# Workspace crates are `publish = false` and currently declare no license (undecided, see
# LICENSING.md), so this allow-list applies to external dependencies only.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
