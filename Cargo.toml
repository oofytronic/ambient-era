[workspace]
resolver = "3"
members = ["crates/*"]
# Spikes are throwaway experiments with their own lockfiles; they are never part of the build.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/oofytronic/ambient-era"
publish = false

[workspace.dependencies]
# Internal crates. External dependencies are added here, one at a time, with a reason
# (see docs/adr/0003-workspace-and-tooling.md), then inherited with `workspace = true`.
ambient-events = { path = "crates/ambient-events" }
ambient-identity = { path = "crates/ambient-identity" }
ambient-spaces = { path = "crates/ambient-spaces" }
ambient-sync = { path = "crates/ambient-sync" }
ambient-store = { path = "crates/ambient-store" }
ambient-transport = { path = "crates/ambient-transport" }
ambient-capabilities = { path = "crates/ambient-capabilities" }
ambient-docs = { path = "crates/ambient-docs" }
ambient-core = { path = "crates/ambient-core" }
ambient-ffi = { path = "crates/ambient-ffi" }
ambient-relay = { path = "crates/ambient-relay" }
ambient-cli = { path = "crates/ambient-cli" }
# BLAKE3-256 is the event id (docs/spec/01-events.md). Default features stay off
# so the browser target does not pull native SIMD.
blake3 = { version = "1.8.7", default-features = false }
# Ed25519 verify, and signing from a caller-supplied seed. No `rand`.
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["alloc"] }
# HKDF-SHA256 for the identity key, the recovery seal key, and the recovery mailbox
# (docs/spec/02-identity-log.md).
hkdf = { version = "0.12.4", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
# X25519 public key of the recovery seal secret. No key generation.
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets"] }
# Secret values zeroize on drop.
zeroize = { version = "1.9.1", default-features = false }
# ChaCha20-Poly1305 seals the local notes file. Not a wire format.
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
# OS randomness for the CLI and the desktop window. Protocol crates do not depend on it.
getrandom = { version = "0.2.16" }
# Linux notes window. Iced draws its own controls in a system window. Not a webview.
iced = { version = "=0.14.0" }
# Test vectors, and the relay's newline-delimited JSON (docs/spec/04-relay-api.md).
serde_json = { version = "1.0.154" }
# HPKE base mode for a private Space (RFC 9180, ADR-0005). X25519 and ChaCha20-Poly1305 only.
hpke = { version = "=0.15.1", default-features = false, features = ["alloc", "x25519", "chacha"] }
# The relay speaks the WebSocket in spec 04. No TLS feature: the binary binds loopback.
tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }
bip39 = { version = "3.0.0", default-features = false, features = ["alloc", "zeroize"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Untrusted input is the norm here: no panics in production code paths.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "warn"
print_stdout = "warn"
print_stderr = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
