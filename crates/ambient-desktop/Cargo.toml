[package]
name = "ambient-desktop"
description = "Offline notes window. Same files as the CLI. No network."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ambient-desktop"
path = "src/main.rs"

[dependencies]
ambient-cli = { workspace = true }
dioxus = { workspace = true, features = ["desktop", "launch", "macro", "html", "hooks", "signals"] }

[lints]
workspace = true
