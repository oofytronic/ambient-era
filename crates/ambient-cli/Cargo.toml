[package]
name = "ambient-cli"
description = "Notes CLI. The root can be wrapped by a local passphrase. It is not a passkey."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ambient"
path = "src/main.rs"

[dependencies]
ambient-events = { workspace = true }
ambient-identity = { workspace = true }
ambient-spaces = { workspace = true }
ambient-store = { workspace = true }
ambient-transport = { workspace = true }
ambient-relay = { workspace = true }
getrandom = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
tungstenite = { workspace = true }
rustls = { workspace = true }
bip39 = { workspace = true }
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
rusqlite = { workspace = true }

[lints]
workspace = true
